<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>M2 GRAF — Cahier d'étude</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2314213D'/%3E%3Ctext x='50' y='64' font-size='40' text-anchor='middle' fill='%232FA98C' font-family='Georgia,serif' font-weight='bold'%3EM2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D;
  --navy-soft:#1C2E52;
  --teal:#2FA98C;
  --teal-soft:#E4F3EF;
  --paper:#F6F4EF;
  --paper-2:#EFEBE1;
  --ink:#22262B;
  --muted:#6B7480;
  --line:#DEDACD;
  --amber:#B8862E;
  --red:#B3432B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}

/* ---------- Layout shell ---------- */
#app{display:flex;min-height:100vh;}

#sidebar{
  width:300px;flex-shrink:0;
  background:var(--navy);
  color:#EDEFF3;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar-head{
  padding:28px 24px 18px;
  border-bottom:1px solid rgba(255,255,255,0.12);
}
#sidebar-head .kicker{font-size:12px;letter-spacing:.04em;color:#9FB0C8;margin-bottom:6px;}
#sidebar-head h1{font-size:24px;margin:0 0 4px;color:#fff;line-height:1.15;}
#sidebar-head .sub{font-size:13px;color:#9FB0C8;}

#progress-box{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.12);}
#progress-box .label{font-size:12px;color:#9FB0C8;margin-bottom:8px;display:flex;justify-content:space-between;}
#progress-track{height:6px;border-radius:4px;background:rgba(255,255,255,0.14);overflow:hidden;}
#progress-fill{height:100%;background:var(--teal);border-radius:4px;transition:width .4s ease;}

#nav-search{padding:14px 24px 6px;}
#nav-search input{
  width:100%;padding:9px 12px;border-radius:7px;border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.06);color:#fff;font-size:13px;
}
#nav-search input::placeholder{color:#8593A8;}

#dictionnaire-link{
  margin:2px 24px 10px;padding:10px 12px;border-radius:8px;
  background:rgba(255,255,255,0.06);color:#D6DCE6;font-size:13px;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,0.1);
}
#dictionnaire-link:hover{background:rgba(255,255,255,0.1);}
#dictionnaire-link.active{background:var(--teal);color:var(--navy);border-color:var(--teal);}

#documents-link{
  margin:2px 24px 14px;padding:10px 12px;border-radius:8px;
  background:rgba(255,255,255,0.06);color:#D6DCE6;font-size:13px;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,0.1);
}
#documents-link:hover{background:rgba(255,255,255,0.1);}
#documents-link.active{background:var(--teal);color:var(--navy);border-color:var(--teal);}


nav#matiere-list{padding:6px 12px 24px;flex:1;}
.sem-label{
  font-size:11px;letter-spacing:.06em;color:#8593A8;
  padding:16px 12px 6px;text-transform:uppercase;
}
.mat-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 12px;border-radius:8px;cursor:pointer;
  font-size:13.5px;line-height:1.3;color:#D6DCE6;
}
.mat-item:hover{background:rgba(255,255,255,0.06);}
.mat-item.active{background:var(--teal);color:var(--navy);font-weight:600;}
.mat-item .dot{
  width:16px;height:16px;border-radius:50%;flex-shrink:0;margin-top:1px;
  border:1.5px solid #5A6C8A;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:transparent;
}
.mat-item.done .dot{background:var(--teal);border-color:var(--teal);color:var(--navy);}
.mat-item.active .dot{border-color:var(--navy);}
.mat-item.active.done .dot{background:var(--navy);color:var(--teal);}
.mat-item .num{font-variant-numeric:tabular-nums;color:#7C8AA0;font-size:12px;}
.mat-item.active .num{color:var(--navy);}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;}
#topbar{
  display:none;
  align-items:center;justify-content:space-between;
  padding:14px 20px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;
}
#topbar button{background:none;border:none;color:#fff;font-size:22px;}

.view{max-width:760px;margin:0 auto;padding:56px 48px 100px;}
@media (max-width:640px){.view{padding:28px 20px 80px;}}

/* Home */
.home-hero{margin-bottom:40px;}
.home-hero .kicker{color:var(--teal);font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px;}
.home-hero h2{font-size:34px;margin:0 0 14px;color:var(--navy);}
.home-hero p{color:var(--muted);font-size:16px;line-height:1.6;max-width:56ch;}

.stat-row{display:flex;gap:14px;margin:28px 0 40px;flex-wrap:wrap;}
.stat-card{
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:16px 20px;min-width:130px;flex:1;
}
.stat-card .n{font-family:'Source Serif 4',serif;font-size:28px;color:var(--navy);}
.stat-card .l{font-size:12.5px;color:var(--muted);margin-top:2px;}

.sem-block{margin-bottom:32px;}
.sem-block h3{font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;}
.home-card{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border:1px solid var(--line);border-radius:10px;
  background:#fff;margin-bottom:8px;cursor:pointer;
  transition:border-color .15s;
}
.home-card:hover{border-color:var(--teal);}
.home-card .idx{
  width:30px;height:30px;border-radius:50%;background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--navy);flex-shrink:0;
  font-family:'Source Serif 4',serif;
}
.home-card.done .idx{background:var(--teal);color:#fff;}
.home-card .body{flex:1;min-width:0;}
.home-card .t{font-weight:600;font-size:14.5px;}
.home-card .m{font-size:12px;color:var(--muted);margin-top:2px;}


/* Matiere view */
.mat-ue{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.mat-title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
.mat-title-row h2{font-size:30px;margin:0;color:var(--navy);}
.btn-mark{
  background:#fff;border:1px solid var(--teal);color:var(--teal);
  padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;
}
.btn-mark:hover{background:var(--teal-soft);}
.btn-mark.is-read{background:var(--teal);color:#fff;}




.tabs{display:flex;gap:4px;margin:24px 0 28px;border-bottom:1px solid var(--line);}
.tab-btn{
  background:none;border:none;padding:10px 4px;margin-right:22px;
  font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;
}
.tab-btn.active{color:var(--navy);border-color:var(--teal);}

.objectifs{background:var(--teal-soft);border-radius:10px;padding:18px 20px;margin-bottom:8px;}
.objectifs h4{margin:0 0 10px;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:#1D7A63;}
.objectifs ul{margin:0;padding-left:18px;}
.objectifs li{margin-bottom:6px;font-size:14px;line-height:1.5;}

.section-block{margin-top:30px;}
.section-block h3{font-size:19px;color:var(--navy);margin:0 0 10px;}
.section-block p{font-size:15.5px;line-height:1.7;color:#333;text-align:justify;margin:0 0 12px;}
.section-block ul{margin:0 0 12px;padding-left:20px;}
.section-block li{font-size:15px;line-height:1.6;margin-bottom:7px;color:#333;}
.formule{
  font-family:'Source Serif 4',serif;font-style:italic;
  background:var(--paper-2);border-left:3px solid var(--teal);
  padding:14px 18px;margin:14px 0;border-radius:0 8px 8px 0;
  font-size:16px;color:var(--navy);overflow-x:auto;white-space:nowrap;
}

.exo-intro{color:var(--muted);font-size:14px;margin-bottom:20px;}
.exo-card{border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px;background:#fff;}
.exo-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.exo-num{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);font-weight:700;}
.exo-title{font-family:'Source Serif 4',serif;font-size:18px;color:var(--navy);}
.exo-enonce{font-size:15px;line-height:1.65;color:#333;margin:0 0 16px;}
.exo-toggle{font-size:13px;}
.exo-correction{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);}
.exo-etapes h5,.exo-solution h5{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.exo-etapes ol{margin:0 0 16px;padding-left:20px;}
.exo-etapes li{font-size:14px;line-height:1.6;margin-bottom:6px;color:#444;font-family:'Source Serif 4',serif;}
.exo-solution{background:var(--teal-soft);border-radius:8px;padding:14px 16px;}
.exo-solution p{margin:0;font-size:14.5px;line-height:1.6;color:#1D7A63;font-weight:500;}

.gen-box{border:1.5px dashed var(--teal);border-radius:12px;padding:22px;margin:28px 0;background:#FBFEFC;}
.gen-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.gen-badge{background:var(--teal);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:12px;}
.gen-title{font-family:'Source Serif 4',serif;font-size:17px;color:var(--navy);}
.gen-desc{font-size:13.5px;color:var(--muted);margin:0 0 16px;}
.gen-generated{border-color:var(--teal);}

.code-switch{display:flex;gap:6px;margin-bottom:16px;}
.code-lang-btn{
  background:#fff;border:1px solid var(--line);padding:7px 16px;border-radius:7px;
  font-size:13px;font-weight:600;color:var(--muted);
}
.code-lang-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.code-block pre{
  background:#1B2436;color:#E4E8F1;border-radius:10px;padding:20px 22px;
  overflow-x:auto;margin:0 0 24px;font-size:13px;line-height:1.6;
}
.code-block code{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;white-space:pre;}

.mat-footer-nav{display:flex;justify-content:space-between;margin-top:52px;padding-top:20px;border-top:1px solid var(--line);}
.mat-footer-nav button{
  background:none;border:1px solid var(--line);padding:10px 16px;border-radius:8px;font-size:13.5px;color:var(--navy);
}
.mat-footer-nav button:hover{border-color:var(--teal);}
.mat-footer-nav button:disabled{opacity:.3;cursor:default;}

/* Quiz */
#quiz-intro{text-align:center;padding:40px 20px;}
#quiz-intro .big-icon{font-size:40px;margin-bottom:12px;}
#quiz-intro p{color:var(--muted);margin-bottom:22px;}
.btn-primary{
  background:var(--navy);color:#fff;border:none;padding:12px 26px;border-radius:8px;
  font-size:14.5px;font-weight:600;
}
.btn-primary:hover{background:var(--navy-soft);}
.btn-ghost{background:none;border:1px solid var(--line);padding:11px 24px;border-radius:8px;font-size:14px;color:var(--navy);}

.q-progress{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
.q-track{height:5px;background:var(--paper-2);border-radius:3px;margin-bottom:26px;overflow:hidden;}
.q-track-fill{height:100%;background:var(--teal);transition:width .3s;}
.q-text{font-size:19px;color:var(--navy);margin-bottom:20px;line-height:1.4;font-family:'Source Serif 4',serif;}
.q-opt{
  display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14.5px;color:var(--ink);
}
.q-opt:hover{border-color:var(--teal);}
.q-opt.correct{background:var(--teal-soft);border-color:var(--teal);color:#1D7A63;font-weight:600;}
.q-opt.wrong{background:#FBEAE5;border-color:var(--red);color:var(--red);font-weight:600;}
.q-opt[disabled]{cursor:default;}
.q-explain{
  font-size:13.5px;color:var(--muted);background:var(--paper-2);border-radius:8px;padding:12px 16px;margin-top:6px;line-height:1.5;
}
.q-next{margin-top:20px;text-align:right;}
.quiz-result{text-align:center;padding:30px 10px;}
.quiz-result .score{font-family:'Source Serif 4',serif;font-size:52px;color:var(--navy);}
.quiz-result .score span{font-size:22px;color:var(--muted);}
.quiz-result .msg{color:var(--muted);margin:8px 0 26px;}

/* Search results view */
.search-hit{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.search-hit .h-ue{font-size:11px;color:var(--muted);text-transform:uppercase;}
.search-hit .h-t{font-weight:600;font-size:15px;}
.search-hit .h-snip{font-size:13px;color:var(--muted);margin-top:2px;}
mark{background:#FDE9B8;padding:0 1px;border-radius:2px;}

/* Dictionnaire */
#dict-search{
  width:100%;padding:12px 16px;border-radius:9px;border:1px solid var(--line);
  font-size:14.5px;margin-bottom:28px;background:#fff;color:var(--ink);
}
.dict-letter{
  font-family:'Source Serif 4',serif;font-size:13px;color:var(--teal);
  letter-spacing:.08em;margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;
}
.dict-letter:first-child{margin-top:0;}
.dict-entry{margin-bottom:18px;}
.dict-term{font-family:'Source Serif 4',serif;font-size:17px;color:var(--navy);font-weight:600;margin-bottom:4px;}
.dict-def{font-size:14.5px;line-height:1.6;color:#333;margin-bottom:8px;}
.dict-chips{display:flex;flex-wrap:wrap;gap:6px;}
.dict-chip{
  font-size:11.5px;background:var(--teal-soft);color:#1D7A63;padding:3px 10px;
  border-radius:12px;cursor:pointer;font-weight:600;
}
.dict-chip:hover{background:var(--teal);color:#fff;}

/* Mes documents */
#doc-upload-box{
  border:1.5px dashed var(--teal);border-radius:12px;padding:24px;margin-bottom:32px;background:#FBFEFC;
}
#doc-upload-box select, #doc-upload-box input[type="file"]{
  width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
  font-size:14px;margin-bottom:14px;font-family:'Inter',sans-serif;background:#fff;
}
#doc-upload-box .btn-primary{width:100%;}
#doc-upload-msg{margin-top:12px;font-size:13px;}
#doc-upload-msg.err{color:var(--red);}
#doc-upload-msg.ok{color:#1D7A63;}
.doc-summary{
  background:var(--teal-soft);border-radius:12px;padding:24px;margin-top:20px;
}
.doc-summary h2, .doc-summary h3{color:var(--navy);font-family:'Source Serif 4',serif;}
.doc-summary h2{font-size:19px;margin:16px 0 8px;}
.doc-summary h2:first-child{margin-top:0;}
.doc-summary ul{margin:0 0 12px;padding-left:20px;}
.doc-summary li{font-size:14.5px;line-height:1.6;margin-bottom:5px;}
.doc-summary p{font-size:14.5px;line-height:1.6;margin:0 0 10px;}

.doc-history-item{
  border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:10px;
  background:#fff;cursor:pointer;
}
.doc-history-item:hover{border-color:var(--teal);}
.doc-history-item .dh-title{font-weight:600;font-size:14.5px;color:var(--navy);}
.doc-history-item .dh-meta{font-size:12px;color:var(--muted);margin-top:2px;}


@media(max-width:900px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .25s ease;width:82vw;max-width:320px;}
  #sidebar.open{transform:translateX(0);}
  #topbar{display:flex;}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;}
  #overlay.show{display:block;}
}

/* Gate (écran de connexion e-mail) */
#gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--navy);padding:20px;
}
#gate-card{
  background:#fff;border-radius:16px;padding:44px 36px;width:100%;max-width:380px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}
#gate-card .kicker{color:var(--teal);font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;}
#gate-card h1{font-size:28px;margin:0 0 14px;color:var(--navy);}
.gate-sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 24px;}
#gate-form-email input, #gate-form-code input{
  width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:9px;
  font-size:14.5px;margin-bottom:14px;font-family:'Inter',sans-serif;
}
#gate-code{text-align:center;letter-spacing:6px;font-size:20px;font-weight:600;}
#gate-form-email .btn-primary, #gate-form-code .btn-primary{width:100%;}
.btn-link{
  display:block;width:100%;background:none;border:none;color:var(--muted);
  font-size:12.5px;padding:10px 0 0;cursor:pointer;text-decoration:underline;
}
.btn-link:hover{color:var(--teal);}
#gate-msg{margin-top:14px;font-size:13px;min-height:18px;}
#gate-msg.err{color:var(--red);}
</style>
</head>
<body>

<div id="gate">
  <div id="gate-card">
    <div class="kicker">IUA · Master 2 GRAF</div>
    <h1>M2 GRAF</h1>

    <div id="gate-step-email">
      <p class="gate-sub">Entre ton adresse e-mail pour recevoir un code de connexion.</p>
      <form id="gate-form-email">
        <input type="email" id="gate-email" placeholder="prenom.nom@exemple.com" required autocomplete="email">
        <button type="submit" id="gate-submit-email" class="btn-primary">Recevoir mon code</button>
      </form>
    </div>

    <div id="gate-step-code" style="display:none;">
      <p class="gate-sub">Un code à 6 chiffres a été envoyé à <strong id="gate-email-display"></strong>.</p>
      <form id="gate-form-code">
        <input type="text" id="gate-code" placeholder="123456" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autocomplete="one-time-code">
        <button type="submit" id="gate-submit-code" class="btn-primary">Vérifier le code</button>
      </form>
      <button id="gate-resend" class="btn-link">Renvoyer le code</button>
      <button id="gate-change-email" class="btn-link">Changer d'adresse e-mail</button>
    </div>

    <div id="gate-msg"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <aside id="sidebar">
    <div id="sidebar-head">
      <div class="kicker">IUA · Master 2</div>
      <h1>M2 GRAF</h1>
      <div class="sub">Gestion des Risques en Assurance et Finance</div>
    </div>
    <div id="progress-box">
      <div class="label"><span>Progression</span><span id="progress-text">0 / 14</span></div>
      <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
    </div>
    <div id="nav-search">
      <input type="text" id="search-input" placeholder="Rechercher une notion…">
    </div>
    <div id="dictionnaire-link">📖 Dictionnaire des notions clés</div>
    <div id="documents-link">📄 Mes documents</div>
    <nav id="matiere-list"></nav>
  </aside>
  <div id="overlay"></div>

  <main id="main">
    <div id="topbar">
      <button id="menu-btn" aria-label="Menu">☰</button>
      <strong style="font-family:'Source Serif 4',serif;">M2 GRAF</strong>
      <span style="width:22px;"></span>
    </div>
    <div id="view-root" class="view"></div>
  </main>
</div>

<script>
// Générateurs paramétrés d'exercices et de quiz numériques.
// Un générateur par matière (index aligné sur content.js), quand la matière s'y prête.
// Chaque générateur retourne { enonce, etapes:[...], solution, reponseNum } pour l'exercice,
// et { q, options:[...], a, exp } pour le quiz (options mélangées côté app).
// rnd(min,max) et rndf(min,max,dec) sont fournies par l'app (nombres aléatoires reproductibles par tirage).

const GENERATORS = {
  // 0 Séries temporelles — lecture d'un test ADF
  0: {
    exo(rnd, rndf) {
      const stat = rndf(-3.5, -1.0, 2);

          "Oui, la ruine est certaine (θ nul, aucune marge de sécurité)",
          "Non, la ruine n'est pas certaine (θ strictement positif)",
          "Cela dépend uniquement de la réserve initiale u",
          "Cela dépend uniquement de la loi des sinistres"
        ],
        a: zero ? 0 : 1,
        exp: zero
          ? "Avec θ = 0, aucune marge de sécurité n'est intégrée : la ruine est certaine (ψ(u)=1 pour tout u)."
          : `θ = ${theta} > 0 : la ruine n'est pas certaine, une réserve suffisante permet ψ(u) < 1.`,
      };
    },
    code(rnd, rndf) {
      const R = rndf(0.0002, 0.0008, 4);
      const u = rnd(20, 80) * 1_000_000;
      return {
        python: `import numpy as np\nR, u = ${R}, ${u}\nborne = np.exp(-R * u)\nprint(f"Borne de Lundberg : psi(u) <= {borne:.2e}")`,
        r: `R <- ${R}; u <- ${u}\nborne <- exp(-R * u)\ncat("Borne de Lundberg : psi(u) <=", format(borne, scientific=TRUE), "\\n")`,
      };
    },
  },

  // 11 Bâle II — ratio McDonough
  11: {
    exo(rnd, rndf) {
      const fp = rnd(30, 60);
      const rwaCredit = rnd(300, 500);
      const rwaMarche = rnd(15, 40);
      const rwaOp = rnd(10, 30);
      const rwaTotal = rwaCredit + rwaMarche + rwaOp;
      const ratio = fp / rwaTotal;
      return {
        enonce: `Fonds propres = ${fp} Mds FCFA. RWA : crédit ${rwaCredit}, marché ${rwaMarche}, opérationnel ${rwaOp} (Mds FCFA). La banque est-elle conforme à Bâle II (min. 8%) ?`,
        etapes: [
          `RWA total = ${rwaCredit} + ${rwaMarche} + ${rwaOp} = ${rwaTotal}`,
          `Ratio = ${fp} / ${rwaTotal}`,
        ],
        solution: `Ratio McDonough = ${(ratio*100).toFixed(1)}% — ${ratio >= 0.08 ? "conforme" : "NON conforme"} (minimum 8%).`,
      };
    },
    quiz(rnd, rndf) {
      const fp = rnd(30, 60);
      const rwaTotal = rnd(350, 600);
      const ratio = fp / rwaTotal;
      return {
        q: `Fonds propres = ${fp}, RWA total = ${rwaTotal} (Mds FCFA). La banque respecte-t-elle le minimum de 8% ?`,
        options: [ratio >= 0.08 ? "Oui, ratio conforme" : "Non, ratio insuffisant", ratio >= 0.08 ? "Non, ratio insuffisant" : "Oui, ratio conforme", "Le minimum réglementaire est 12%", "Cela dépend uniquement du Pilier 2"],
        a: 0,
        exp: `Ratio = ${fp}/${rwaTotal} = ${(ratio*100).toFixed(1)}%, ${ratio>=0.08?"supérieur":"inférieur"} au seuil de 8%.`,
      };
    },
    code(rnd, rndf) {
      const fp = rnd(30, 60);
      const rwaCredit = rnd(300, 500);
      const rwaMarche = rnd(15, 40);
      const rwaOp = rnd(10, 30);
      return {
        python: `fp, rwa_credit, rwa_marche, rwa_op = ${fp}, ${rwaCredit}, ${rwaMarche}, ${rwaOp}\nrwa_total = rwa_credit + rwa_marche + rwa_op\nratio = fp / rwa_total\nprint(f"Ratio McDonough = {ratio:.1%} — conforme: {ratio >= 0.08}")`,
        r: `fp <- ${fp}; rwa_credit <- ${rwaCredit}; rwa_marche <- ${rwaMarche}; rwa_op <- ${rwaOp}\nrwa_total <- rwa_credit + rwa_marche + rwa_op\nratio <- fp / rwa_total\ncat("Ratio McDonough =", round(ratio*100,1), "% — conforme:", ratio >= 0.08, "\\n")`,
      };
    },
  },

  // 12 Solvabilité II — ratio de solvabilité
  12: {
    exo(rnd, rndf) {
      const fp = rnd(80, 180);
      const scr = rnd(60, 140);
      const ratio = fp / scr;
      return {
        enonce: `Fonds propres éligibles = ${fp} Mds FCFA, SCR = ${scr} Mds FCFA. Calculer le ratio de solvabilité.`,
        etapes: [`Ratio = ${fp} / ${scr}`],
        solution: `Ratio de solvabilité ≈ ${(ratio*100).toFixed(0)}% — ${ratio >= 1 ? "au-dessus" : "en-dessous"} du seuil réglementaire de 100%.`,
      };
    },
    quiz(rnd, rndf) {
      const scr1 = rnd(30, 90);
      const scr2 = rnd(20, 70);
      const corr = rndf(0.1, 0.4, 2);
      const bscr = Math.sqrt(scr1*scr1 + scr2*scr2 + 2*corr*scr1*scr2);
      const somme = scr1+scr2;
      return {
        q: `SCR1=${scr1}, SCR2=${scr2}, corr=${corr}. Le BSCR agrégé (${bscr.toFixed(1)}) est-il inférieur à la somme simple (${somme}) ?`,
        options: ["Oui, toujours (effet de diversification)", "Non, il est toujours supérieur", "Seulement si corr > 0,5", "Seulement si les deux SCR sont égaux"],
        a: 0,
        exp: `BSCR = ${bscr.toFixed(1)} < ${somme} : l'agrégation par corrélation < 1 produit toujours un bénéfice de diversification.`,
      };
    },
    code(rnd, rndf) {
      const fp = rnd(80, 180);
      const scr = rnd(60, 140);
      return {
        python: `fp, scr = ${fp}, ${scr}\nratio = fp / scr\nprint(f"Ratio de solvabilité = {ratio:.0%}")`,
        r: `fp <- ${fp}; scr <- ${scr}\nratio <- fp / scr\ncat("Ratio de solvabilité =", round(ratio*100), "%\\n")`,
      };
    },
  },
};

function normCdf(x) {
  // Approximation d'Abramowitz-Stegun de la fonction de répartition normale
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989423 * Math.exp(-x * x / 2);
  let p = d * t * (0.3193815 + t*(-0.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274))));
  if (x > 0) p = 1 - p;
  return p;
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i = a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuizPool(m){
  const gen = GENERATORS[m.id];
  let pool = m.quiz.slice();
  if(gen){
    const nGen = 6;
    for(let k=0;k<nGen;k++) pool.push(gen.quiz(rnd, rndf));
  }
  return shuffleArr(pool);
}

function renderQuizTab(m, tc){
  const gen = GENERATORS[m.id];
  if(!m.quiz.length && !gen){
    tc.innerHTML = '<div id="quiz-intro"><p>Aucun quiz pour cette matière.</p></div>';
    return;
  }
  if(!state.quiz){
    const best = progress[m.id] && progress[m.id].bestScore !== undefined ? progress[m.id] : null;
    const totalDisponible = m.quiz.length + (gen ? 6 : 0);
    tc.innerHTML = '<div id="quiz-intro">' +
      '<div class="big-icon">📝</div>' +
      '<p>' + totalDisponible + ' questions (' + (gen ? 'banque + générées aléatoirement, différentes à chaque tentative' : 'banque fixe') + ') pour tester ta compréhension de "' + esc(m.titre) + '".' +
      (best ? '<br>Meilleur score : <strong>' + best.bestScore + '/' + best.total + '</strong>' : '') + '</p>' +
      '<button class="btn-primary" id="start-quiz">Commencer le quiz</button>' +
    '</div>';
    document.getElementById('start-quiz').addEventListener('click', () => {
      state.quiz = { qi: 0, score: 0, answered: false, selected: null, order: buildQuizPool(m) };
      renderQuizTab(m, tc);
    });
    return;
  }

  const qz = state.quiz;
  if(qz.qi >= qz.order.length){
    const pct = Math.round(qz.score/qz.order.length*100);
    const p = progress[m.id] || {};
    if(p.bestScore === undefined || qz.score > p.bestScore){ p.bestScore = qz.score; p.total = qz.order.length; }
    progress[m.id] = p; saveProgress(progress); renderSidebar();

    tc.innerHTML = '<div class="quiz-result">' +
      '<div class="score">' + qz.score + '<span>/' + qz.order.length + '</span></div>' +
      '<div class="msg">' + (pct >= 75 ? 'Bien maîtrisé — continue ainsi.' : pct >= 50 ? 'Correct, quelques notions à revoir.' : 'Relis le cours puis retente le quiz.') + '</div>' +
      '<button class="btn-ghost" id="retry-quiz">Refaire le quiz</button> ' +
      '<button class="btn-primary" id="back-cours">Revoir le cours</button>' +
    '</div>';
    document.getElementById('retry-quiz').addEventListener('click', () => {
      state.quiz = { qi: 0, score: 0, answered: false, selected: null, order: buildQuizPool(m) };
      renderQuizTab(m, tc);
    });
    document.getElementById('back-cours').addEventListener('click', () => {
      state.tab = 'cours'; state.quiz = null; renderMatiere();
    });
    return;
  }

  const q = qz.order[qz.qi];
  let h = '<div class="q-progress">Question ' + (qz.qi+1) + ' / ' + qz.order.length + '</div>' +
    '<div class="q-track"><div class="q-track-fill" style="width:' + (qz.qi/qz.order.length*100) + '%"></div></div>' +
    '<div class="q-text">' + esc(q.q) + '</div>';
  q.options.forEach((opt, oi) => {
    let cls = 'q-opt';
    if(qz.answered){
      if(oi === q.a) cls += ' correct';
      else if(oi === qz.selected) cls += ' wrong';
    }
    h += '<button class="' + cls + '" data-oi="' + oi + '" ' + (qz.answered?'disabled':'') + '>' + esc(opt) + '</button>';
  });
  if(qz.answered){
    h += '<div class="q-explain">' + esc(q.exp) + '</div>' +
      '<div class="q-next"><button class="btn-primary" id="next-q">' + (qz.qi+1 < qz.order.length ? 'Question suivante →' : 'Voir le résultat') + '</button></div>';
  }
  tc.innerHTML = h;

  if(!qz.answered){
    tc.querySelectorAll('.q-opt').forEach(b => b.addEventListener('click', () => {
      const oi = parseInt(b.dataset.oi);
      qz.answered = true; qz.selected = oi;
      if(oi === q.a) qz.score++;
      renderQuizTab(m, tc);
    }));
  } else {
    document.getElementById('next-q').addEventListener('click', () => {
      qz.qi++; qz.answered = false; qz.selected = null;
      renderQuizTab(m, tc);
    });
  }
}

function highlightSnippet(snippet, q){
  const lower = snippet.toLowerCase();
  const pos = lower.indexOf(q);
  if(pos < 0) return esc(snippet);
  return esc(snippet.slice(0,pos)) + '<mark>' + esc(snippet.slice(pos,pos+q.length)) + '</mark>' + esc(snippet.slice(pos+q.length));
}

/* ---------------- Search ---------------- */
function renderSearch(query){
  const q = query.trim().toLowerCase();
  if(!q){ state.view='home'; setActiveDictLink(false); renderHome(); return; }
  setActiveDictLink(false);
  const hits = [];
  DATA.forEach(m => {
    m.sections.forEach(sec => {
      const hay = (sec.titre + ' ' + (sec.paragraphs||[]).join(' ') + ' ' + (sec.bullets||[]).join(' ')).toLowerCase();
      if(hay.includes(q)){
        const src = (sec.paragraphs && sec.paragraphs[0]) || (sec.bullets && sec.bullets[0]) || '';
        const pos = src.toLowerCase().indexOf(q);
        const snippet = pos >= 0 ? '…' + src.slice(Math.max(0,pos-40), pos+80) + '…' : src.slice(0,100);
        hits.push({ m, sec, snippet });
      }
    });
  });
  let html = '<div class="home-hero"><div class="kicker">Recherche</div><h2>« ' + esc(query) + ' »</h2>' +
    '<p>' + hits.length + ' résultat(s)</p></div>';
  hits.slice(0,40).forEach(h => {
    html += '<div class="search-hit" data-id="' + h.m.id + '">' +
      '<div class="h-ue">' + esc(h.m.titre) + ' — ' + esc(h.sec.titre) + '</div>' +
      '<div class="h-snip">' + highlightSnippet(h.snippet, q) + '</div>' +
    '</div>';
  });
  root.innerHTML = html;
  root.querySelectorAll('.search-hit').forEach(el => el.addEventListener('click', () => openMatiere(parseInt(el.dataset.id))));
}

/* ---------------- Mes documents ---------------- */
function mdToHtml(md){
  const lines = (md || '').split('\n');
  let html = '';
  let inList = false;
  for (const raw of lines) {
    const line = raw.trim();
    if(line.startsWith('## ')){
      if(inList){ html += '</ul>'; inList = false; }
      html += '<h2>' + esc(line.slice(3)) + '</h2>';
    } else if(line.startsWith('- ') || line.startsWith('* ')){
      if(!inList){ html += '<ul>'; inList = true; }
      html += '<li>' + esc(line.slice(2)) + '</li>';
    } else if(line === ''){
      if(inList){ html += '</ul>'; inList = false; }
    } else {
      if(inList){ html += '</ul>'; inList = false; }
      html += '<p>' + esc(line) + '</p>';
    }
  }
  if(inList) html += '</ul>';
  return html;
}

async function submitDocUpload(){
  const fileInput = document.getElementById('doc-file');
  const matiereTitre = document.getElementById('doc-matiere').value;
  const msgEl = document.getElementById('doc-upload-msg');
  const btn = document.getElementById('doc-submit');
  const file = fileInput.files[0];

  if(!file){ msgEl.textContent = 'Choisis un fichier PDF.'; msgEl.className = 'err'; return; }
  if(file.size > 4 * 1024 * 1024){ msgEl.textContent = 'Fichier trop volumineux (max 4 Mo).'; msgEl.className = 'err'; return; }
  if(!currentEmail){ msgEl.textContent = 'Session expirée, recharge la page.'; msgEl.className = 'err'; return; }

  btn.disabled = true;
  btn.textContent = 'Analyse en cours…';
  msgEl.textContent = '';
  msgEl.className = '';

  try {
    const fileBase64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const res = await fetch('/api/summarize-doc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail, filename: file.name, fileBase64, matiereTitre: matiereTitre || null }),
    });

    if(res.status === 413){ msgEl.textContent = 'Fichier trop volumineux pour le serveur (max 4 Mo).'; msgEl.className = 'err'; return; }
    if(res.status === 403){ msgEl.textContent = "Cet accès a été bloqué. Contacte l'administrateur."; msgEl.className = 'err'; return; }
    if(!res.ok){
      const { error } = await res.json().catch(() => ({}));
      msgEl.textContent = error === 'pdf_parse_failed' || error === 'empty_pdf'
        ? "Impossible de lire ce PDF (peut-être un scan sans texte). Réessaie avec un autre fichier."
        : "Échec de l'analyse. Réessaie dans un instant.";
      msgEl.className = 'err';
      return;
    }

    const { doc } = await res.json();
    msgEl.textContent = 'Analyse terminée.';
    msgEl.className = 'ok';
    showDocSummary(doc);
    loadDocHistory();
    fileInput.value = '';
  } catch(err){
    console.error('submitDocUpload error:', err);
    msgEl.textContent = 'Connexion impossible. Réessaie.';
    msgEl.className = 'err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyser le document';
  }
}

function showDocSummary(doc){
  const el = document.getElementById('doc-result');
  el.innerHTML = '<div class="doc-summary">' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">' + esc(doc.filename) + (doc.matiereTitre ? ' — ' + esc(doc.matiereTitre) : '') + '</div>' +
    mdToHtml(doc.summary) +
  '</div>';
}

async function loadDocHistory(){
  const el = document.getElementById('doc-history');
  if(!el || !currentEmail) return;
  try {
    const res = await fetch('/api/summarize-doc?email=' + encodeURIComponent(currentEmail));
    if(!res.ok){ el.innerHTML = '<p style="color:var(--muted);font-size:13.5px;">Historique indisponible.</p>'; return; }
    const { docs } = await res.json();
    if(!docs.length){ el.innerHTML = '<p style="color:var(--muted);font-size:13.5px;">Aucun document analysé pour l\'instant.</p>'; return; }
    el.innerHTML = docs.map(d =>
      '<div class="doc-history-item" data-id="' + esc(d.id) + '">' +
        '<div class="dh-title">' + esc(d.filename) + '</div>' +
        '<div class="dh-meta">' + (d.matiereTitre ? esc(d.matiereTitre) + ' — ' : '') + new Date(d.createdAt).toLocaleDateString('fr-FR') + '</div>' +
      '</div>'
    ).join('');
    el.querySelectorAll('.doc-history-item').forEach(item => {
      const doc = docs.find(d => d.id === item.dataset.id);
      item.addEventListener('click', () => { showDocSummary(doc); window.scrollTo(0,0); });
    });
  } catch(err){
    console.error('loadDocHistory error:', err);
    el.innerHTML = '<p style="color:var(--muted);font-size:13.5px;">Historique indisponible.</p>';
  }
}

function renderDictionnaire(query){
  const q = (query||'').trim().toLowerCase();
  const matieresById = {}; DATA.forEach(m => matieresById[m.id] = m);
  const filtered = GLOSSARY.filter(g =>
    !q || g.terme.toLowerCase().includes(q) || g.def.toLowerCase().includes(q)
  ).sort((a,b) => a.terme.localeCompare(b.terme, 'fr'));

  let html = '<div class="home-hero">' +
    '<div class="kicker">Vocabulaire transversal</div>' +
    '<h2>Dictionnaire des notions clés</h2>' +
    '<p>' + GLOSSARY.length + ' termes et expressions clés couvrant les 14 matières. Recherche un mot ou clique une matière pour filtrer.</p>' +
  '</div>';
  html += '<input type="text" id="dict-search" placeholder="Rechercher un terme…" value="' + esc(query||'') + '">';
  html += '<div id="dict-results"></div>';
  root.innerHTML = html;

  function renderList(list){
    if(!list.length){
      document.getElementById('dict-results').innerHTML = '<p style="color:var(--muted);margin-top:20px;">Aucun terme trouvé.</p>';
      return;
    }
    let curLetter = null;
    let h = '';
    list.forEach(g => {
      const letter = g.terme[0].toUpperCase();
      if(letter !== curLetter){ curLetter = letter; h += '<div class="dict-letter">' + letter + '</div>'; }
      const chips = (g.mats||[]).map(mid => matieresById[mid] ? '<span class="dict-chip" data-id="' + mid + '">' + esc(matieresById[mid].titre) + '</span>' : '').join('');
      h += '<div class="dict-entry"><div class="dict-term">' + esc(g.terme) + '</div>' +
        '<div class="dict-def">' + esc(g.def) + '</div>' +
        '<div class="dict-chips">' + chips + '</div></div>';
    });
    document.getElementById('dict-results').innerHTML = h;
    document.querySelectorAll('.dict-chip').forEach(c => c.addEventListener('click', () => openMatiere(parseInt(c.dataset.id))));
  }
  renderList(filtered);

  document.getElementById('dict-search').addEventListener('input', (e) => {
    const nq = e.target.value.trim().toLowerCase();
    const list = GLOSSARY.filter(g => !nq || g.terme.toLowerCase().includes(nq) || g.def.toLowerCase().includes(nq))
      .sort((a,b) => a.terme.localeCompare(b.terme, 'fr'));
    renderList(list);
  });
}

/* ---------------- Déverrouillage & déchiffrement ---------------- */
const SESSION_KEY = 'm2graf_session_v1'; // { email, token }
let pendingEmail = null;

function hexToBytes(hex){
  const arr = new Uint8Array(hex.length/2);
  for(let i=0;i<arr.length;i++) arr[i] = parseInt(hex.substr(i*2,2),16);
  return arr;
}
function base64ToBytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function decryptContent(hexKey){
  const res = await fetch('/app.enc', { cache: 'no-store' });
  if(!res.ok) throw new Error('fetch_enc_failed');
  const b64 = (await res.text()).trim();
  const raw = base64ToBytes(b64);
  const iv = raw.slice(0, 12);
  const combined = raw.slice(12); // ciphertext || authTag, format attendu par Web Crypto
  const keyBytes = hexToBytes(hexKey);
  const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, combined);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

function showGateMsg(text, kind){
  const el = document.getElementById('gate-msg');
  el.textContent = text;
  el.className = kind || '';
}

function showEmailStep(){
  document.getElementById('gate-step-email').style.display = 'block';
  document.getElementById('gate-step-code').style.display = 'none';

function showCodeStep(email){
  document.getElementById('gate-email-display').textContent = email;
  document.getElementById('gate-step-email').style.display = 'none';
  document.getElementById('gate-step-code').style.display = 'block';
  document.getElementById('gate-code').value = '';
  document.getElementById('gate-code').focus();
}

let isSendingCode = false;
let isVerifyingCode = false;

async function finishUnlock(key, email, token){
  const decrypted = await decryptContent(key);
  DATA = decrypted.items;
  GLOSSARY = decrypted.glossary;
  LS_KEY = 'm2graf_progress_' + email;
  currentEmail = email;
  progress = loadProgress();
  if(token) localStorage.setItem(SESSION_KEY, JSON.stringify({ email, token }));
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderSidebar();
  renderHome();
}

async function sendCode(email, isResend){
  if(isSendingCode) return;
  isSendingCode = true;
  const btn = document.getElementById(isResend ? 'gate-resend' : 'gate-submit-email');
  btn.disabled = true;
  const originalText = btn.textContent;
  if(!isResend) btn.textContent = 'Envoi…';
  showGateMsg('', '');
  try {
    const res = await fetch('/api/send-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    if(res.status === 429){
      showGateMsg('Un code a déjà été envoyé il y a moins de 30 secondes. Vérifie tes messages (et tes spams).', 'err');
    } else if(!res.ok){
      showGateMsg("Impossible d'envoyer le code pour le moment. Réessaie dans un instant.", 'err');
    } else {
      pendingEmail = email;
      showCodeStep(email);
      showGateMsg('Code envoyé — pense à vérifier tes spams si tu ne le vois pas.', '');
    }
  } catch(err){
    console.error('sendCode error:', err);
    showGateMsg('Connexion impossible. Vérifie ta connexion internet.', 'err');
  } finally {
    isSendingCode = false;
    btn.disabled = false;
    if(!isResend) btn.textContent = originalText;
  }
}

async function verifyCode(email, code){
  if(isVerifyingCode) return;
  isVerifyingCode = true;
  const btn = document.getElementById('gate-submit-code');
  btn.disabled = true;
  btn.textContent = 'Vérification…';
  showGateMsg('', '');
  try {
    const res = await fetch('/api/verify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code }),
    });
    if(res.status === 403){
      showGateMsg("Cet accès a été bloqué. Contacte l'administrateur.", 'err');
      showEmailStep();
      return;
    }
    if(res.status === 400){
      const { error } = await res.json().catch(() => ({}));
      showGateMsg(
        error === 'expired' ? 'Ce code a expiré, demande-en un nouveau.' :
        error === 'wrong_code' ? 'Code incorrect, réessaie.' :
        'Code invalide, demande-en un nouveau.', 'err'
      );
      return;
    }
    if(res.status === 429){
      showGateMsg('Trop de tentatives. Demande un nouveau code.', 'err');
      showEmailStep();
      return;
    }
    if(!res.ok){
      showGateMsg("Le service est momentanément indisponible. Réessaie dans un instant.", 'err');
      return;
    }
    const { key, token } = await res.json();
    try {
      await finishUnlock(key, email, token);
    } catch(decryptErr){
      console.error('Erreur de déchiffrement du contenu:', decryptErr);
      showGateMsg("Erreur au déchiffrement du contenu : " + (decryptErr && decryptErr.message ? decryptErr.message : decryptErr), 'err');
    }
  } catch(err){
    console.error('verifyCode error:', err);
    showGateMsg("Connexion impossible. Vérifie ta connexion internet et réessaie.", 'err');
  } finally {
    isVerifyingCode = false;
    btn.disabled = false;
    btn.textContent = 'Vérifier le code';
  }
}

async function resumeSession(email, token){
  try {
    const res = await fetch('/api/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, token }),
    });
    if(!res.ok){
      localStorage.removeItem(SESSION_KEY);
      if(res.status === 403) showGateMsg("Cet accès a été bloqué. Contacte l'administrateur.", 'err');
      showEmailStep();
      return;
    }
    const { key } = await res.json();
    try {
      await finishUnlock(key, email, null);
    } catch(decryptErr){
      console.error('Erreur de déchiffrement (resume):', decryptErr);
      localStorage.removeItem(SESSION_KEY);
      showEmailStep();
    }
  } catch(err){
    console.error('resumeSession error:', err);
    showEmailStep();
  }
}

document.getElementById('gate-form-email').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('gate-email').value.trim().toLowerCase();
  if(!email) return;
  sendCode(email, false);
});

document.getElementById('gate-form-code').addEventListener('submit', (e) => {
  e.preventDefault();
  const code = document.getElementById('gate-code').value.trim();
  if(!code || !pendingEmail) return;
  verifyCode(pendingEmail, code);
});

document.getElementById('gate-resend').addEventListener('click', () => {
  if(pendingEmail) sendCode(pendingEmail, true);
});

document.getElementById('gate-change-email').addEventListener('click', () => {
  pendingEmail = null;
  showGateMsg('', '');
  showEmailStep();
});

(function initGate(){
  try {
    const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if(saved && saved.email && saved.token){
      showGateMsg('Reconnexion…', '');
      resumeSession(saved.email, saved.token);
    }
  } catch(e){}
})();
